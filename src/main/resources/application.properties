server.port=8080

spring.application.name=medical-inventory-system


# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=Govardhan@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================================
# JSON
# =========================================================

spring.jackson.serialization.fail-on-empty-beans=false


# =========================================================
# OLLAMA LOCAL AI
# =========================================================

ollama.api.url=http://localhost:11434/api

ollama.model=llama3.2


# =========================================================
# EMAIL
# =========================================================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=medicalinventory053@gmail.com

spring.mail.password=Govardhan@123

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO

logging.level.com.medical.inventory=INFO


# =========================================================
# ERROR HANDLING
# =========================================================

server.error.include-message=always

server.error.include-binding-errors=always


# =========================================================
# CORS
# =========================================================

spring.web.cors.allowed-origins=http://localhost:5173

spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

spring.web.cors.allowed-headers=*

spring.web.cors.allow-credentials=true